name: Release

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write # npm trusted publishing (OIDC) + provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          registry-url: https://registry.npmjs.org
      # Staged publishing (`npm stage`) needs npm 12; Node 22 ships npm 10.
      - run: npm install -g npm@12
      - name: Tag matches package.json version
        run: test "${GITHUB_REF_NAME#v}" = "$(node -p "require('./package.json').version")"
      - run: npm ci
      - run: npm run check
      # Staged: the version goes live only after you approve it on npmjs.com (2FA).
      - run: npm stage publish .
