name: Pages

# Publishes the landing page (marketing/site) to GitHub Pages.
# GitHub Free only serves Pages from public repos, so this skips while the repo is private.

on:
  push:
    branches: [main]
    paths: [marketing/**, .github/workflows/pages.yml]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # Two jobs, as in GitHub's own Pages workflow: the deploy job starts only after the upload is
  # finalized. Uploading and deploying in one job races ("No artifacts named github-pages").
  build:
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: node marketing/build.mjs
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: marketing/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
